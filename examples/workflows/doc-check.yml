name: Documentation drift
on:
  pull_request:
    paths: ['**.py', '**.md', '**.mdx', '**.toml']
concurrency:
  group: docmend-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check documentation
        # For production, replace the version with an audited full commit SHA.
        # Never use './' to execute PR-controlled action code with credentials.
        uses: nymav/docmend@v0.3.0
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          output: docmend-report
          llm: 'false'
          semantic: 'false'
          publish: 'false'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: documentation-report
          path: docmend-report/
          if-no-files-found: warn
