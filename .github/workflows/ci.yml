name: Validate DocMend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and integration tests (no external APIs)
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Package installation
        run: python -m pip install --no-deps .
      - name: Installed CLI
        run: docmend --version
      - name: End-to-end demo and fixture evaluation
        env:
          PYTHONPATH: src
        run: python scripts/demo.py --output artifacts/demo
      - name: Frozen evaluation and line coverage
        env:
          PYTHONPATH: src
        run: |
          python scripts/evaluate.py --split development --output artifacts/evaluation/development-v0.1.1
          python scripts/evaluate.py --split challenge --output artifacts/evaluation/challenge-v0.1.1
          python scripts/evaluate.py --split source-backed --output artifacts/evaluation/source-backed-v0.1.1
          python scripts/coverage_report.py
      - name: Docker image builds
        run: docker build -t docmend-ci .
      - name: Container validation (read-only source, no network)
        run: >-
          docker run --rm --network none --read-only --tmpfs /tmp:rw
          --mount type=bind,src=${{ github.workspace }},dst=/validation,readonly
          --workdir /validation --entrypoint python docmend-ci
          -m unittest discover -s tests -q
      - uses: actions/upload-artifact@v7
        with:
          name: validation-python-${{ matrix.python }}
          path: artifacts/
          if-no-files-found: error
