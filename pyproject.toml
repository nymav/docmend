[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docmend"
version = "0.1.0"
description = "Evidence-bound documentation drift detection and guarded repairs"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
docmend = "docmend.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
