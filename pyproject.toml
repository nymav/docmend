[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docmend"
version = "0.3.0"
description = "Evidence-bound documentation drift detection and guarded repairs"
requires-python = ">=3.11"
license = {text = "LicenseRef-Teyrin-Proprietary"}
classifiers = ["License :: Other/Proprietary License", "Private :: Do Not Upload"]
dependencies = []

[project.optional-dependencies]
js = ["tree-sitter==0.26.1", "tree-sitter-javascript==0.25.0", "tree-sitter-typescript==0.23.2"]

[project.scripts]
docmend = "docmend.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
